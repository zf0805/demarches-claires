name: Import Démarches Claires source

on:
  push:
    branches: [main]
    paths:
      - demarches-claires-source.zip

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import committed source archive
        run: |
          unzip -o demarches-claires-source.zip
          rm demarches-claires-source.zip
          rm .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Démarches Claires application"
          git push
